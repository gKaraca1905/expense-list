<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Expense List</h1>

    <!-- Harcama ekleme formu -->
    <form id="expense-form">
      <input type="text" id="name" placeholder="Expense name (e.g. Groceries)">
      <input type="number" id="amount" placeholder="Amount" step="0.01">
      <button type="submit">Add</button>
    </form>

    <!-- Hata mesajı buraya yazılır -->
    <p id="error" class="error"></p>

    <!-- Harcamalar JavaScript ile buraya eklenir -->
    <ul id="expense-list"></ul>

    <!-- Toplam -->
    <p class="total">Total: $<span id="total">0.00</span></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
